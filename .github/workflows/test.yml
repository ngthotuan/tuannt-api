name: Test

# Every branch except main gets the full suite (Testcontainers needs the runner's Docker).
# main is covered by deploy.yml, which runs the same `mvn verify` before releasing.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B clean verify
