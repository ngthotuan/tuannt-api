spring:
  profiles:
    active: article,dev
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=true&sslMode=REQUIRED&serverTimezone=UTC
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Sized for a single Basic dyno with light traffic. Connections are recycled well before the
    # TiDB Serverless gateway can drop them as idle, so the pool never hands out a dead one.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      max-lifetime: 300000
      # Must stay below max-lifetime, or Hikari ignores it and logs a warning at every boot.
      idle-timeout: 240000
      keepalive-time: 120000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  # Flyway owns the schema; ddl-auto stays none so Hibernate never changes tables itself.
  flyway:
    enabled: true
    locations: classpath:db/migration
auth:
  # Required: the app refuses to boot without it, like the Telegram/Adyen placeholders.
  jwtSecret: ${JWT_SECRET}
  tokenTtl: 30d
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
cors:
  allowedOriginPatterns:
    - "https://nttuan.dev"
    - "https://*.nttuan-web.pages.dev"
    - "http://localhost:5173"
    - "http://localhost:4173"
  allowedMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowedHeaders:
    - "*"
  maxAge: 3600
server:
  port: ${PORT:8089}
  config:
    connection-timeout: 30000
    request-timeout: 30000
    read-timeout: 30000
    write-timeout: 30000
    max-ide-time: 20000
    max-connection: 50
    max-life-time: 60000
